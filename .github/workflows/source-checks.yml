name: Source checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python source syntax
        run: python -m py_compile river_app_final.py
      - name: Run dependency-free smoke tests
        run: python -m unittest discover -s tests -v
